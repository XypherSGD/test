name: Generic Windows Build
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup MSBuild path
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Compile using the project configuration rather than raw flags
      - name: Build Solution
        run: msbuild MyProject.sln /p:Configuration=Release /p:Platform=x64
