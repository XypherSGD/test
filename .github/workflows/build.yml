name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build driver.sys
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null

          # Get the exact SDK version installed on the runner
          $version = $env:WindowsSDKVersion
          
          # Construct the guaranteed paths
          $kmPath = "C:\Program Files (x86)\Windows Kits\10\Include\$version\km"
          $libKm = "C:\Program Files (x86)\Windows Kits\10\Lib\$version\km\x64"
          
          Write-Host "SDK Path: $kmPath"

          # 1. Append the KM path to the existing INCLUDE variable (don't overwrite)
          $env:INCLUDE = "$kmPath;$env:INCLUDE"
          
          # 2. Pass the LIB path to the linker
          $env:LIB = "$libKm;$env:LIB"

          # 3. Compile with explicit include flag as a backup
          cl /c /W4 /I"$kmPath" driver\driver.c /Fo:build\driver.obj
          if ($LASTEXITCODE -ne 0) { throw "Driver compilation failed" }

          # 4. Link the driver
          link /OUT:build\driver.sys /SUBSYSTEM:NATIVE /ENTRY:DriverEntry /MACHINE:X64 /DRIVER build\driver.obj ntoskrnl.lib hal.lib
          if ($LASTEXITCODE -ne 0) { throw "Driver linking failed" }

          Write-Host "✅ Driver built successfully!"

      - name: Build cheat.exe
        run: |
          cl /EHsc /O2 /W3 /DUNICODE /D_UNICODE cheat\main.cpp /Fe:build\cheat.exe /link user32.lib gdi32.lib

      - uses: actions/upload-artifact@v4
        with:
          name: cheat
          path: build/
